version = 1

# TERMINALS
[macos.terminals]
# apps = ["ghostty", "warp"]  # Ghostty commented out: crash issues on macOS Tahoe
apps = ["wezterm"]

# EDITORS
[macos.editors]
apps = ["zed", "visual-studio-code", "helix"]

# BROWSERS
[macos.browsers]
apps = ["firefox", "google-chrome"]

# AI
[macos.ai]
apps = ["claude-desktop", "chatgpt-desktop", "codex-desktop", "opencode-desktop", "claude-cli", "opencode-cli", "pi-cli", "codex-cli", "grok-cli", "codex-acp", "gemini-cli"]

# CONFIG
[macos.config]
# "raycast-config", "ghostty-config" commented out — see terminals section
apps = ["git-config", "zsh-config", "sheldon-config", "starship-config", "wezterm-config", "terminal-config", "zed-config", "mise-config", "helix-config", "cheatsheet-config", "keyboard-layout-config"]

# PRODUCTIVITY
[macos.productivity]
# "raycast", "tana", "bettershot",
apps = ["obsidian", "aqua-voice", "keycastr", "kap"]

# DISPLAY
[macos.display]
apps = ["betterdisplay"]

# SECURITY
[macos.security]
# "sandvault"
apps = []

# UTILITIES
[macos.utilities]
# "thaw"
apps = ["keymapp"]

# FONTS
[macos.fonts]
apps = ["font-jetbrains-mono-nerd-font"]

# CLI
[macos.cli]
apps = ["starship", "eza", "bat", "ripgrep", "fzf", "sheldon", "jq", "gh", "hcloud", "tailscale", "restic", "mole"]

# RUNTIMES
[macos.runtimes]
apps = ["node", "python", "rust", "bun", "pnpm", "erlang", "elixir"]

# TERMINALS
[linux.terminals]
apps = ["wezterm-linux"]

# EDITORS
[linux.editors]
apps = ["visual-studio-code-linux", "helix"]

# BROWSERS
[linux.browsers]
apps = ["google-chrome-linux"]

# AI
[linux.ai]
apps = ["claude-desktop-linux", "codex-desktop-linux", "t3-code-linux", "hermes-agent", "claude-cli", "codex-cli", "pi-cli", "opencode-cli", "gemini-cli", "grok-cli", "codex-xpando", "herdr"]

# CONFIG
[linux.config]
apps = ["git-config", "zsh-config", "sheldon-config", "starship-config", "wezterm-config", "mise-config", "tmux-config", "helix-config", "yazi-config", "cheatsheet-config", "keyboard-layout-config"]

# PRODUCTIVITY
[linux.productivity]
apps = ["obsidian-linux", "bitwarden-linux"]

# CONTAINERS
[linux.containers]
apps = ["docker-linux"]

# DATABASES
[linux.databases]
apps = ["postgresql-17-linux", "pgadmin4-linux"]

# MEDIA AND COMMUNICATION
[linux.media]
apps = ["spotify-linux", "telegram-linux", "discord-linux", "vlc-linux"]

# DESKTOP PREFERENCES
[linux.desktop]
apps = ["bibata-cursor-linux", "gnome-cursor-yellow", "gnome-screenshot-shortcut", "desktop-commands-linux", "gnome-shortcut-screens-monitor", "gnome-shortcut-screens-tv", "gnome-shortcut-screens-both", "voxtype-linux", "voxtype-config", "ydotool", "wl-clipboard", "gnome-shortcut-voxtype-toggle"]

# FONTS
[linux.fonts]
apps = ["jetbrains-mono-nerd-font-linux"]

# CLI
[linux.cli]
apps = ["starship", "eza", "bat", "ripgrep", "fzf", "sheldon", "jq", "gh", "tea", "hcloud", "infisical", "tmux", "yazi", "lazygit", "btop-linux", "ncdu", "tailscale", "restic", "uv", "ffmpeg", "yt-dlp", "postgresql-client"]

# RUNTIMES
[linux.runtimes]
apps = ["node", "python", "rust", "bun", "pnpm", "erlang", "elixir", "dexter"]
