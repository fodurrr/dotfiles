# =============================================================================
# apps.toml - Centralized App Registry
# =============================================================================
# Every app, tool, and config is defined here.
#
# Fields:
#   type        = "cask" | "brew" | "mise" | "curl" | "stow"
#   name        = package name (optional, defaults to section name)
#   tap         = homebrew tap (optional, for casks from taps)
#   version     = version string (optional, for mise tools)
#   bin         = command name for command ownership/collision checks (optional)
#   mise_options = extra backend options for the generated mise config, as inline TOML (optional)
#   enforce_single_source = fail install if command resolves to multiple sources (optional, for mise tools)
#   kind        = "desktop" | "cli" (optional, for casks)
#   category    = grouping for documentation
#   depends_on  = "app-key" (optional, install dependency first)
#   config_for  = "app-key" (optional, associate config/defaults to app)
#   platform    = ["macos", "linux"] (optional, defaults to all platforms)
#   linux_name  = Linux package name for cross-platform brew entries (optional)
#   linux_apt   = Debian/Ubuntu package override (optional)
#   linux_dnf   = Fedora/RHEL package override (optional)
#
# Profile membership is defined in profiles/*.toml
# =============================================================================

